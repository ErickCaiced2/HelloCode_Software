# ===================================================================
# CONFIGURACIÓN DEL SISTEMA GESTOR EJERCICIOS
# ===================================================================

# Configuración de directorios y archivos
directorio.data=src/main/resources/GestorEjercicios/data/
archivo.progreso=progreso_usuario.json

# Límites de ejercicios por tipo de lección
ejercicios.max.leccion=5
ejercicios.max.prueba=10
ejercicios.max.diagnostico=8

# Configuración de depuración y logging
debug.enabled=true
log.nivel=INFO
log.mostrar.timestamps=true

# Configuración de persistencia
persistencia.auto.guardar=true
persistencia.backup.enabled=true
persistencia.backup.intervalo.minutos=30

# Configuración de experiencia y puntuación
experiencia.leccion.normal=15
experiencia.leccion.prueba=30
experiencia.leccion.diagnostico=0
conocimiento.leccion.normal=5
conocimiento.leccion.prueba=0

# Configuración de integración con otros módulos
integracion.comunidad.enabled=true
integracion.gamificacion.enabled=true
integracion.gestion.aprendizaje.enabled=true

# Configuración de interface de usuario
ui.theme=default
ui.idioma=es
ui.mostrar.animaciones=true

# Configuración de validación
validacion.ejercicios.estricta=false
validacion.tiempo.limite.segundos=300
